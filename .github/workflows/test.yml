name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: npm ci
        continue-on-error: true

      - name: Compile TypeScript
        id: compile
        run: npm run compile
        continue-on-error: true

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Format check
        id: format
        run: npm run format:check
        continue-on-error: true

      - name: Run tests with coverage
        id: coverage_test
        run: npm run test:coverage
        continue-on-error: true

      - name: Read coverage summary
        id: coverage
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "lines=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.lines.pct)")" >> "$GITHUB_OUTPUT"
            echo "branches=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.branches.pct)")" >> "$GITHUB_OUTPUT"
            echo "functions=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.functions.pct)")" >> "$GITHUB_OUTPUT"
            echo "statements=$(node -e "const c=require('./coverage/coverage-summary.json');console.log(c.total.statements.pct)")" >> "$GITHUB_OUTPUT"
          else
            echo "lines=N/A" >> "$GITHUB_OUTPUT"
            echo "branches=N/A" >> "$GITHUB_OUTPUT"
            echo "functions=N/A" >> "$GITHUB_OUTPUT"
            echo "statements=N/A" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Slack message
        id: slack_message
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${{ steps.install.outcome }}" = "success" ] &&
             [ "${{ steps.compile.outcome }}" = "success" ] &&
             [ "${{ steps.lint.outcome }}" = "success" ] &&
             [ "${{ steps.format.outcome }}" = "success" ] &&
             [ "${{ steps.coverage_test.outcome }}" = "success" ]; then
            STATUS_ICON=":white_check_mark:"
            STATUS_TEXT="passed"
          else
            STATUS_ICON=":x:"
            STATUS_TEXT="FAILED"
          fi
          {
            echo "short_sha=$SHORT_SHA"
            echo "status_icon=$STATUS_ICON"
            echo "status_text=$STATUS_TEXT"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.slack_message.outputs.status_icon }} CommitCraft AI tests ${{ steps.slack_message.outputs.status_text }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.slack_message.outputs.status_icon }} *CommitCraft AI* — Tests ${{ steps.slack_message.outputs.status_text }}\n*Branch:* `${{ github.ref_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ steps.slack_message.outputs.short_sha }}`> by ${{ github.actor }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Lines:* ${{ steps.coverage.outputs.lines }}%" },
                    { "type": "mrkdwn", "text": "*Branches:* ${{ steps.coverage.outputs.branches }}%" },
                    { "type": "mrkdwn", "text": "*Functions:* ${{ steps.coverage.outputs.functions }}%" },
                    { "type": "mrkdwn", "text": "*Statements:* ${{ steps.coverage.outputs.statements }}%" },
                    { "type": "mrkdwn", "text": "*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>" }
                  ]
                }
              ]
            }

      - name: Fail if any check failed
        if: always() && (steps.install.outcome != 'success' || steps.compile.outcome != 'success' || steps.lint.outcome != 'success' || steps.format.outcome != 'success' || steps.coverage_test.outcome != 'success')
        run: exit 1
